<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abby's Pet Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F0FF;--pn:#fff;--ink:#5B4B6B;--soft:#EFE6FF;--pk:#FF9EC4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241C30;--pn:#33283F;--ink:#F3E9FF;--soft:#4A3B5E}}
:root[data-theme="dark"]{--bg:#241C30;--pn:#33283F;--ink:#F3E9FF;--soft:#4A3B5E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',ui-rounded,system-ui,sans-serif}
.app{max-width:1100px;margin:0 auto;padding:14px;display:grid;gap:16px;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);align-items:start}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:clamp(24px,5vw,34px)}h3{margin:12px 0 6px;font-size:16px}
button{font:inherit;color:var(--ink);background:var(--soft);border:3px solid var(--ink);border-radius:999px;padding:6px 13px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:none}button:disabled{opacity:.45}
button:focus-visible{outline:3px solid var(--pk);outline-offset:3px}
button.on{background:var(--pk);color:#5B4B6B;font-weight:600}
.coins{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px}
.coin{width:26px;height:26px;border-radius:50%;background:#FFD84D;border:3px solid var(--ink);box-shadow:inset 0 0 0 3px #FFE98F}
.meters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.m{flex:1;min-width:90px;font-size:14px}.m i{display:block;height:12px;margin-top:3px;border:3px solid var(--ink);border-radius:9px;background:var(--pn);overflow:hidden}
.m i:after{content:"";display:block;height:100%;width:var(--v);background:var(--c);transition:width .4s}
.stage{position:relative;aspect-ratio:4/3;container-type:inline-size;overflow:hidden;overflow:clip;border:4px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);background:#fff;user-select:none;-webkit-user-select:none}
.stage>*{position:absolute}
.wall{inset:0 0 34% 0;border-bottom:3px solid var(--ink)}.floor{inset:66% 0 0 0}
.wall:before{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:rgba(255,255,255,.35);border-top:3px solid rgba(91,75,107,.4)}
.dc{translate:-50% -50%;pointer-events:none}.dc svg{display:block;width:100%;overflow:visible}
.pet{width:27cqw;translate:-50% -85%;pointer-events:none}
.flip{transform:scaleX(var(--d,1))}.pet svg{display:block;width:100%;overflow:visible}
.pet *{transform-box:fill-box}
.pa{transform-origin:50% 100%;animation:br 2.6s ease-in-out infinite}.walk .pa{animation:hop .35s ease-in-out infinite}
.tail{transform-origin:0 100%;animation:wag 1.4s ease-in-out infinite alternate}.walk .tail{animation-duration:.3s}
.hd{transform-origin:50% 100%;transition:rotate .2s}.sulk .hd{rotate:-9deg}.sulk .pa{scale:1 .93}
.eo,.ec,.es,.mo{display:none}.eo,.mg{display:block}
.happy .eo,.sulk .eo,.eat .eo{display:none}.happy .ec,.eat .ec{display:block}.sulk .es{display:block}
.happy .mg,.eat .mg{display:none}.happy .mo,.eat .mo{display:block}
.eat .hd{animation:nom .3s infinite alternate}.shake{animation:shk .5s}.yay .pa{animation:hop .3s 3}
.dirt{opacity:var(--dirt)}.sulk .tail{animation:none;rotate:-30deg}
@keyframes br{50%{scale:1.03 .97}}@keyframes hop{50%{translate:0 -9%;scale:.95 1.06}}@keyframes wag{to{rotate:20deg}}
@keyframes nom{to{translate:0 6%}}@keyframes shk{20%,60%{translate:-6% 0}40%,80%{translate:6% 0}}
.poop{width:7.5cqw;translate:-50% -50%;cursor:pointer;padding:0;border:0;background:none;box-shadow:none;border-radius:0;animation:pp .35s cubic-bezier(.3,1.8,.5,1)}
.poop svg{display:block;width:100%;overflow:visible}.poop path.sk{animation:sk 1.6s ease-in-out infinite alternate}
@keyframes pp{from{scale:0}}@keyframes sk{from{opacity:.2;translate:0 3px}to{opacity:.9;translate:0 -3px}}
#deco,#poops,#fx{inset:0;pointer-events:none}.poop{pointer-events:auto}
.di{position:absolute;translate:-50% -50%;cursor:grab;touch-action:none;pointer-events:auto}.di svg{display:block;width:100%;overflow:visible}.di.sel{outline:3px dashed var(--ink);outline-offset:4px;border-radius:12px}
#out{inset:0;width:100%;height:100%;display:none}.stage[data-m=out] #out{display:block}.stage[data-m=out] .wall,.stage[data-m=out] .floor{display:none}.modes{display:flex;gap:8px}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.say{background:var(--pn);color:var(--ink);border:3px solid var(--ink);border-radius:16px 16px 16px 3px;padding:4px 10px;font-size:3cqw;font-weight:600;translate:-30% -150%;max-width:46cqw;width:max-content;pointer-events:none;opacity:0;transition:opacity .2s;z-index:200}
.say.on{opacity:1}
.fx{translate:-50% -50%;pointer-events:none;z-index:150}
.bub{width:4cqw;height:4cqw;border-radius:50%;border:.5cqw solid #fff;background:rgba(190,230,255,.7);animation:bu .8s forwards}
@keyframes bu{to{translate:-50% -300%;opacity:0}}
.ht{width:5cqw;animation:bu 1.2s forwards}.ht svg{display:block;width:100%}
.bar{margin-top:12px;min-height:44px;font-size:15px;opacity:.9}
.panel{background:var(--pn);border:4px solid var(--ink);border-radius:28px;padding:14px;box-shadow:0 6px 0 var(--ink)}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
.grid h3,.grid .row{grid-column:1/-1;margin:6px 0 0}.row{display:flex;flex-wrap:wrap;gap:9px}
.tl{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:20px;font-size:15px}.tl svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sw{width:36px;height:36px;padding:0;border-radius:50%}.sw.on{outline:3px solid var(--pk);outline-offset:3px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;grid-column:1/-1;font-size:15px}.it small{opacity:.8}
@media(max-width:820px){.app{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body>

  <div class="pet" id="pet"><div class="flip"><div class="pa" id="pa"></div></div></div>
  <div class="say" id="say"></div><div id="fx"></div>
 </div>
 <div class="bar" id="bar"></div>
</section>
<aside class="panel"><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div></aside>
</main>

function runAway(){go(Math.random()*100,64+Math.random()*24);pet.fast=1}
function poop(sneaky){if(S.poops.length>=6)return;let x=pet.x,y=pet.y+2;const rg=L().find(i=>i.k=='rug');if(sneaky&&rg&&Math.random()<.6){x=rg.x+Math.random()*8-4;y=rg.y}S.poops.push({x,y});if(sneaky)say(R(LINES.poop),2600);else say('...',1200);drawPoops();save()}
function drawPoops(){$('#poops').innerHTML=S.poops.map((p,i)=>`<button class="poop" aria-label="Scoop poop" data-i="${i}" style="position:absolute;left:${p.x}%;top:${p.y}%;z-index:${Math.round(p.y)}">${POOP}</button>`).join('')}
$('#poops').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=S.poops.splice(+b.dataset.i,1)[0];S.joy=cl(S.joy+2);earn(2);fx('ht',p.x,p.y,'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFD84D" stroke="#5B4B6B" stroke-width="2.5"/></svg>');drawPoops();save();bar()};
function feed(){
  const f=FOOD[food];if(food!='kibble'&&!S.inv[food])return say('Out of '+f[0].toLowerCase()+'! Check the shop.');
  if(pet.busy)return;pet.busy=1;go(26,80);
  const chk=setInterval(()=>{if(Math.hypot(pet.x-pet.tx,pet.y-pet.ty)>1.5)return;clearInterval(chk);pet.d=-1;
    $('#food').style.opacity=1;
    const p=f[3]+sass()*.5+(S.full>85?.5:0);
    setTimeout(()=>{
      if(Math.random()<p){say(R(LINES.refuse));setState('sulk',2600);$('#food').style.opacity=0;S.joy=cl(S.joy-2);if(S.full>85)say('Too full. Stop it.')}
      else{if(food!='kibble')S.inv[food]--;S.full=cl(S.full+f[2]);S.joy=cl(S.joy+f[4]);S.pend++;earn(1);say(R(LINES.eat));setState('eat',1800);setTimeout(()=>$('#food').style.opacity=0,1800)}
      upd();save();render();setTimeout(()=>{pet.busy=0;pet.d=1},2600)},900)},100)}
const hit=(px,py)=>Math.abs(px-pet.x)<14&&Math.abs(py-(pet.y-9))<14;
const pct=e=>{const r=$('#stage').getBoundingClientRect();return[(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100]};
const st=$('#stage');
st.addEventListener('pointerdown',e=>{const[x,y]=pct(e);ptr=[x,y];last=[x,y];
  if(tool=='hug'&&hit(x,y)&&!pet.busy){pet.hold=1;hug=0;pet.busy=1;setState('happy');say('...what are you doing.',1500)}
  if(tool=='play'&&S.ball&&!e.target.closest('button'))fetchBall(x,y)});
st.addEventListener('pointermove',e=>{if(!ptr)return;const[x,y]=pct(e),dist=Math.hypot(x-last[0],y-last[1]);last=[x,y];const over=hit(x,y);
  if(tool=='bath'&&over&&!pet.busy&&dist>0){S.clean=cl(S.clean+(S.bub?1.6:.9));fx('bub',x,y);upd();
    if(Date.now()>dodgeAt&&Math.random()<.04+sass()*.12){dodgeAt=Date.now()+2500;say(R(LINES.dodge),1500);runAway();setState('sulk',1000)}
    if(S.clean>=100){S.clean=100;done()}}
  if(tool=='pet'&&over&&!pet.busy){pet.rub=(pet.rub||0)+dist;setState('happy',500);if(pet.rub>12){pet.rub=0;S.joy=cl(S.joy+1.2);upd();if(Math.random()<.4)hearts();
    if(Math.random()<sass()*.13){say(R(LINES.swat));setState('sulk',2200);pet.busy=1;S.joy=cl(S.joy-1);runAway()}}}});
const up=()=>{ptr=null;if(drag){drag=null;save()}if(pet.hold){pet.hold=0;if(hug<100){say('Hey! I was busy.',1400);setState('sulk',1000)}}};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
function done(){S.clean=100;cleanedAt=Date.now();earn(5);S.joy=cl(S.joy+5);say(R(LINES.ok),2600);setState('happy',1500);tool=null;render();save();bar()}
function fetchBall(x,y){
  fx('',x,y,'<svg viewBox="0 0 24 24" style="width:5cqw"><circle cx="12" cy="12" r="9" fill="#FF9EC4" stroke="#5B4B6B" stroke-width="2.5"/><path d="M4 9Q12 14 20 9" fill="none" stroke="#fff" stroke-width="2"/></svg>');
  if(pet.busy)return;
  if(Math.random()<.75-sass()*.6){pet.busy=1;go(x,y);const c=setInterval(()=>{if(Math.hypot(pet.x-pet.tx,pet.y-pet.ty)>2)return;clearInterval(c);S.joy=cl(S.joy+6);earn(1);say('Mine!',1200);setState('yay happy',1200);upd()},100)}
  else{say(R(LINES.ball));setState('sulk',2000);pet.busy=1}}
const TOOLS=[['feed','Feed'],['bath','Bathe'],['pet','Pet'],['hug','Cuddle'],['play','Play']];
const MSG={feed:'Pick a meal, then tap the bowl button. They may refuse.',bath:'Scrub the pet by dragging over it. It will try to flee.',pet:'Drag over the pet to stroke it. Bad moods mean swats.',hug:'Press and hold on the pet to cuddle. Hold on tight.',play:S=>S.ball?'Tap the room to toss the ball.':'Buy a ball in the shop first.'};
function bar(){const e=L()[sel];st.style.touchAction=tool&&tool!='feed'?'none':'';
 if(!tool&&e){$('#bar').innerHTML=[['dn','Smaller'],['up','Bigger'],['fl','Flip'],['cl','Recolor'],['cp','Copy'],['rm','Remove']].map(([a,t])=>`<button data-a="${a}">${t}</button>`).join('');return}
 $('#bar').textContent=tool?(typeof MSG[tool]=='function'?MSG[tool](S):MSG[tool]):(S.poops.length?'Tap a poop to scoop it for coins.':'Drag decor to move it, tap it to edit. Pick a care tool to look after the pet.')}
const L=()=>S.it[mode];
function upd(){$('#cn').textContent=S.coins;
  $('#mt').innerHTML=[['Full','full','#FFB27A'],['Clean','clean','#7EC8F0'],['Happy','joy','#FF9EC4']].map(([n,k,c])=>`<div class="m">${n}<i style="--v:${S[k]}%;--c:${c}"></i></div>`).join('');
  $('#pet').style.setProperty('--dirt',((100-S.clean)/100).toFixed(2))}
function drawPet(){$('#pa').innerHTML=petSVG()}
function render(){
  $('#tabs').innerHTML=[['care','Care'],['shop','Shop'],['decor','Decorate']].map(([k,n])=>`<button data-tab="${k}" class="${tab==k?'on':''}">${n}</button>`).join('');
  let h='';
  if(tab=='care'){h=TOOLS.map(([k,n])=>`<button class="tl${tool==k?' on':''}" data-t="${k}">${IC[k]}${n}</button>`).join('');
    if(tool=='feed')h+='<h3>Meal</h3><div class="row">'+Object.entries(FOOD).map(([k,f])=>`<button class="${food==k?'on':''}" data-food="${k}">${f[0]}${k=='kibble'?'':' x'+S.inv[k]}</button>`).join('')+'</div><div class="row"><button data-serve="1">Put it in the bowl</button></div>'}
  if(tab=='shop'){const b=(id,n,p,d,dis,lab)=>`<div class="it"><span>${n}<br><small>${d}</small></span><button data-buy="${id}" ${dis||(S.coins<p&&lab!='Wear')?'disabled':''}>${dis?(lab?'Wearing':'Owned'):(lab??p)}</button></div>`;
    h='<h3>Pet supplies (earn coins by caring!)</h3>'+b('treat','Treat',5,'Tasty, rarely refused')+b('steak','Fancy steak',15,'Fills them right up')+b('ball','Toy ball',25,'Unlocks Play',S.ball)+b('bub','Bubble bath',30,'Baths go much faster',S.bub)+'<h3>Coat colors</h3>'+COAT.map((c,i)=>b('coat'+i,c[0],c[2],'<span class="coin" style="width:14px;height:14px;background:'+c[1]+';display:inline-block;vertical-align:middle"></span> coat',S.coat==i,S.own.includes(i)?'Wear':c[2])).join('')}
  if(tab=='decor'){const sw=(a,k,cur,at)=>'<div class="row">'+a.map((c,i)=>`<button class="sw${cur==i?' on':''}" data-${at}="${i}" style="background:${c}" aria-label="${k} ${i+1}"></button>`).join('')+'</div>',tx=(a,at,cur)=>'<div class="row">'+a.map((p,i)=>`<button class="${cur==i?'on':''}" data-${at}="${i}">${p[0]}</button>`).join('')+'</div>';
    h='<h3>Decorating is always free</h3>'+(mode=='in'?'<h3>Walls</h3>'+sw(WC,'Wall',S.wall,'w')+tx(WP,'wp',S.wp)+'<h3>Floor</h3>'+sw(FC,'Floor',S.floor,'fl')+tx(FP,'fp',S.fp):'<h3>Sky</h3>'+tx(SKY,'sky',S.sky)+'<h3>Roof</h3>'+sw(RC,'Roof',S.roof,'roof'))+'<h3>Add items</h3><div class="row">'+Object.entries(FURN).map(([k,F])=>`<button data-add="${k}">${F[0]}</button>`).join('')+'</div><div class="row" style="margin-top:12px"><button data-rnd="1">Surprise me</button><button data-clr="1">Clear all decor</button></div>'}
  $('#grid').innerHTML=h;bar()}
function paint(){const g=$('#stage'),w=$('#wall'),f=$('#floor');g.dataset.m=mode;w.style.backgroundColor=WC[S.wall];w.style.backgroundImage=WP[S.wp][1];w.style.backgroundSize=WP[S.wp][2];f.style.backgroundColor=FC[S.floor];f.style.backgroundImage=FP[S.fp][1];f.style.backgroundSize=FP[S.fp][2];
 const k=SKY[S.sky];[['--s1',k[1]],['--s2',k[2]],['--sc',k[3]],['--or',RC[S.roof]]].forEach(([a,b])=>g.style.setProperty(a,b));drawItems()}
function drawItems(){$('#deco').innerHTML=L().map((it,i)=>{const F=FURN[it.k];return `<div class="di${i==sel?' sel':''}" data-i="${i}" style="left:${it.x}%;top:${it.y}%;width:${it.s}cqw;z-index:${it.k=='rug'?1:Math.round(it.y)-1};--c:${COL[it.ci]};transform:scaleX(${it.f})"><svg viewBox="${F[2]}">${F[1]}</svg></div>`}).join('')}
$('#deco').addEventListener('pointerdown',e=>{const d=e.target.closest('.di');if(!d||tool)return;sel=+d.dataset.i;const it=L()[sel],[px,py]=pct(e);drag={it,d,dx:it.x-px,dy:it.y-py};d.setPointerCapture(e.pointerId);[...$('#deco').children].forEach(c=>c.classList.toggle('sel',c==d));bar()});
st.addEventListener('pointermove',e=>{if(!drag)return;const[px,py]=pct(e);drag.it.x=cl(px+drag.dx,3,97);drag.it.y=cl(py+drag.dy,3,97);drag.d.style.left=drag.it.x+'%';drag.d.style.top=drag.it.y+'%'});
st.addEventListener('pointerdown',e=>{if(!e.target.closest('.di')&&sel>=0){sel=-1;drawItems();bar()}});
$('#bar').onclick=e=>{const a=e.target.closest('button')?.dataset.a,l=L(),it=l[sel];if(!it)return;
 if(a=='dn')it.s=Math.max(6,it.s*.88);if(a=='up')it.s=Math.min(60,it.s*1.14);if(a=='fl')it.f*=-1;if(a=='cl')it.ci=(it.ci+1)%COL.length;if(a=='cp'){l.push({...it,x:Math.min(94,it.x+6),y:Math.min(94,it.y+4)});sel=l.length-1}if(a=='rm'){l.splice(sel,1);sel=-1}drawItems();bar();save()};
$('#grid').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.t){tool=tool==d.t?null:d.t;if(tool=='play'&&!S.ball)say('No ball yet!')}
  else if(d.food)food=d.food;else if(d.serve)feed();
  else if(d.buy){const id=d.buy,P={treat:5,steak:15,ball:25,bub:30};
    if(id.startsWith('coat')){const i=+id.slice(4),c=COAT[i];if(S.own.includes(i)){S.coat=i;drawPet()}else if(S.coins>=c[2]){S.coins-=c[2];S.own.push(i);S.coat=i;drawPet()}}
    else if(S.coins>=P[id]){S.coins-=P[id];if(id=='treat'||id=='steak')S.inv[id]++;else S[id]=1}
    upd()}
  else if(d.w!=null)S.wall=+d.w;else if(d.fl!=null)S.floor=+d.fl;else if(d.wp!=null)S.wp=+d.wp;else if(d.fp!=null)S.fp=+d.fp;else if(d.sky!=null)S.sky=+d.sky;else if(d.roof!=null)S.roof=+d.roof;
  else if(d.rnd){if(mode=='in'){S.wall=R([0,1,2,3,4,5]);S.wp=R([0,1,2]);S.floor=R([0,1,2,3,4]);S.fp=R([0,1,2])}else{S.sky=R([0,1,2]);S.roof=R([0,1,2,3,4])}say('A whole new look!',1800)}
  else if(d.clr){S.it[mode]=[];sel=-1;say('Blank canvas!',1800)}
  else if(d.add){if(L().length<30){const F=FURN[d.add];L().push({k:d.add,x:50,y:d.add=='frame'?30:76,s:F[3],f:1,ci:0});sel=L().length-1}}
  paint();render();save()};
const mq=document.querySelector('.modes');mq.onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;sel=-1;mq.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));paint();render();say(mode=='in'?'Back inside.':'Fresh air. Meh.',1600)};
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.tab;if(tab!='care')tool=null;render()}};
// main loop
setInterval(()=>{const p=pet,pe=$('#pet');
  if(p.hold){hug+=6;if(Math.random()<.015+sass()*.04&&hug<100){p.hold=0;p.busy=1;say(R(LINES.wig),1800);setState('sulk',1200);S.joy=cl(S.joy-2);runAway();upd()}
    else if(hug>=100){p.hold=0;p.busy=0;S.joy=cl(S.joy+14);earn(3);hearts();say('Okay. That was nice. Don\'t tell anyone.',2500);setState('happy',1600);upd();save()}}
  const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
  if(!p.hold&&d>1){const sp=p.fast?1.6:.45;p.x+=dx/d*sp;p.y+=dy/d*sp;if(Math.abs(dx)>.5)p.d=dx<0?-1:1;pe.classList.add('walk')}
  else{pe.classList.remove('walk');p.fast=0;if(!p.busy&&!p.hold&&Math.random()<.015)go(14+Math.random()*72,66+Math.random()*20)}
  pe.style.left=p.x+'%';pe.style.top=p.y+'%';pe.style.zIndex=Math.round(p.y);pe.style.setProperty('--d',p.d);if(say.t)placeSay()},80);
setInterval(()=>{S.full=cl(S.full-.3);S.clean=cl(S.clean-.1-S.poops.length*.1);S.joy=cl(S.joy-.1-S.poops.length*.07-(S.full<25?.2:0)-(S.clean<25?.1:0));
  if(S.pend>0&&--pt<=0){S.pend--;pt=12+Math.random()*14;poop()}
  if(Date.now()-cleanedAt<30000&&Math.random()<.05){cleanedAt=0;poop(true)}
  if(!pet.busy&&S.full<20&&Math.random()<.05)say(R(['Feed me. Now.','Hungry. Do something.']));
  if(!pet.busy&&S.joy<25&&Math.random()<.04)say(R(['Nobody loves me.','I am NOT fine.']));
  upd();save()},1000);
drawPet();paint();drawPoops();upd();render();go(50,76);
</script></body></html>
